                // 각 팀에게 3장씩 나눠주기
                const updatedTeamsData = teamsData.map(team => {
                    const clientCards = [];
                    for (let i = 0; i < 3 && remainingCards.length > 0; i++) {
                        const randomIndex = Math.floor(Math.random() * remainingCards.length);
                        clientCards.push(remainingCards[randomIndex]);
                        remainingCards.splice(randomIndex, 1);
                    }
                    return { ...team, clientCards };
                });

                setTeamsData(updatedTeamsData);

                // PeerJS로 각 Client에 카드 전송
                updatedTeamsData.forEach(team => {
                    const conn = teamConnectionsRef.current[team.id];
                    if (conn && conn.open) {
                        conn.send({
                            type: 'RECEIVE_CARDS',
                            cards: team.clientCards
                        });
                    }
                });
            };

            // 라운드 시작 시 덱 준비
            const prepareDeck = () => {
                const cardCount = getCardCount(teamsCount);

                // 1. 기본 카드 4개 (변하지 않음)
                const newBaseDeck = [];
                MASCOTS.forEach(mascot => {
                    const straightenCard = CARDS.find(c => c.mascotId === mascot.id && c.effect === 'straighten');
                    if (straightenCard) {
                        newBaseDeck.push(straightenCard);
                    }
                });
                setBaseDeck(newBaseDeck);

                // 2. straighten을 제외한 카드에서 cardCount만큼 랜덤 뽑기
                const nonStraightenCards = CARDS.filter(c => c.effect !== 'straighten').sort(() => Math.random() - 0.5);
                const newRandomDeck = nonStraightenCards.slice(0, cardCount);
                setRandomDeck(newRandomDeck);

                // 3. 전체 덱 = 기본 + 랜덤
                setDeck([...newBaseDeck, ...newRandomDeck]);
            };

            const applyCardEffect = (mascotId, card, currentState) => {
                const state = { ...currentState };
                const FINISH = 11;

                const applyMovement = (distance) => {
                    if (state.isFallen) {
                        state.position += Math.min(1, Math.abs(distance)) * Math.sign(distance);
                    } else {
                        state.position += distance * state.direction;
                    }
                    state.position = Math.max(0, Math.min(FINISH, state.position));
                    state.isFallen = false;
                };

                switch (card.effect) {
                    case 'straighten':
                        state.isFallen = false;
                        applyMovement(1);
                        break;
                    case 'star':
                        const nextStar = Math.ceil(state.position / 5) * 5;
                        state.position = Math.min(FINISH, nextStar);
                        state.isFallen = false;
                        break;
                    case 'fallen':
                        state.isFallen = true;
                        break;
                    case 'turnAround':
                        state.direction *= -1;
                        break;
                    case 'retreat2':
                        applyMovement(-2);
                        break;
                    case 'forward2':
                        applyMovement(2);
                        break;
                    case 'forward3':
                        applyMovement(3);
                        break;
                    case 'forward1Stumble':
                        applyMovement(1);
                        state.position += 0.5;
                        break;
                    case 'forward2Stumble':
                        applyMovement(2);
                        state.position += 0.5;
                        break;
                    case 'forward3Stumble':
                        applyMovement(3);
                        state.position += 0.5;
                        break;
                    case 'forward1':
                        applyMovement(1);
                        break;
                    case 'straightenForward2':
                        state.isFallen = false;
                        applyMovement(1); // 똑바로
                        applyMovement(2); // 2칸 전진
                        break;
                    case 'straightenForward3':
                        state.isFallen = false;
                        applyMovement(1); // 똑바로
                        applyMovement(3); // 3칸 전진
                        break;
                }
                return state;
            };

            // 참여 조의 수에 따라 사용할 카드 수 결정
            const getCardCount = (count) => {
                const cardMap = { 3: 11, 4: 10, 5: 9, 6: 8, 7: 7, 8: 6 };
                return cardMap[count] || 10;
            };

            // Shuffle deck
            const shuffleDeck = () => {
                const newDeck = [...CARDS];
                for (let i = newDeck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
                }
                setDeck(newDeck);
            };

            // Run Race Simulation
            const runRace = () => {
                broadcastPhase('RACE');
                const cardCount = getCardCount(teamsCount);
                const fullDeck = deck.length > 0 ? deck : [...CARDS].sort(() => Math.random() - 0.5);
                const deckToUse = fullDeck.slice(0, cardCount);
                let newStates = { ...mascotStates };
                let deckIndex = 0;

                // Draw cards and apply effects for each mascot
                MASCOTS.forEach(mascot => {
                    let card = null;
                    while (deckIndex < deckToUse.length && !card) {
                        const drawn = deckToUse[deckIndex++];
                        if (drawn.mascotId === mascot.id || drawn.isUniversal) {
                            card = drawn;
                        }
                    }
                    if (card && newStates[mascot.id]) {
                        newStates[mascot.id] = applyCardEffect(mascot.id, card, newStates[mascot.id]);
                    }
                });

                // Animate Race
                setTimeout(() => {
                    setMascotStates(newStates);

                    // Calculate Winner
                    const sorted = Object.entries(newStates)
                        .map(([id, state]) => [id, state.position])
                        .sort((a, b) => b[1] - a[1]);
                    const winnerId = sorted[0][0];

                    // Calculate Scores
                    setTeamsData(prev => prev.map(t => {
                        if (t.bet === winnerId) {
                            return { ...t, score: t.score + 50 };
                        }
                        return t;
                    }));

                    setTimeout(() => broadcastPhase('RESULT'), 2000);
                }, 1000);
            };

            const nextRound = () => {
                setMascotStates({
                    hotdog: { position: 0, direction: 1, isFallen: false },
                    bear: { position: 0, direction: 1, isFallen: false },
                    duck: { position: 0, direction: 1, isFallen: false },
                    rabbit: { position: 0, direction: 1, isFallen: false }
                });
                setTeamsData(prev => prev.map(t => ({ ...t, bet: null, card: null, bettingTiles: [], clientCards: [] })));
                setUsedBettingTiles({ hotdog: 0, bear: 0, duck: 0, rabbit: 0 });
                setBettingRound(null);
                setCurrentBettingTeamIndex(0);
                setReceivedCards([]);
                setSelectedBettingMascot(null);
                setRound(r => r + 1);
                prepareDeck();
                broadcastPhase('WAITING');
            };

            // Selection Screen
            if (!role) {
                return (
                    <div className="flex flex-col items-center justify-center p-8 min-h-[600px]">
                        <h1 className="text-4xl font-extrabold mb-8 text-amber-400">🔥 Hot Streak Workshop</h1>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-md">
                            <button onClick={initHost} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-6 rounded-xl shadow-lg transition flex flex-col items-center justify-center gap-2">
                                <span className="text-2xl">📺</span>
                                <span>메인 스크린 생성 (Host)</span>
                            </button>
                            <div className="bg-slate-800 p-6 rounded-xl flex flex-col gap-3">
                                <h2 className="text-xl font-bold text-slate-100">📱 조별 접속 (Client)</h2>
                                <input
                                    type="text"
                                    placeholder="호스트 코드 입력"
                                    value={targetHostId}
                                    onChange={e => setTargetHostId(e.target.value)}
                                    className="p-2.5 rounded bg-slate-700 border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                                />
                                <select
                                    value={teamNo}
                                    onChange={e => setTeamNo(e.target.value)}
                                    className="p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-indigo-500"
                                >
                                    {Array.from({ length: 8 }, (_, i) => (
                                        <option key={i + 1} value={i + 1}>{i + 1}조</option>
                                    ))}
                                </select>
                                <button onClick={initClient} className="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition mt-1 text-white">
                                    접속하기
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // HOST TEAMS SETUP SCREEN
            if (role === 'host' && teamsCount === null) {
                return (
                    <div className="flex flex-col items-center justify-center p-8 min-h-[600px]">
                        <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 w-full max-w-md">
                            <h1 className="text-3xl font-bold text-amber-400 mb-2 text-center">🔥 Hot Streak</h1>
                            <p className="text-slate-400 text-center mb-8">레이싱에 참여할 조의 개수를 입력하세요</p>

                            <div className="flex flex-col gap-4">
                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="block text-sm font-bold text-slate-300">참여 조의 개수 (3-8)</label>
                                        <span className="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded">
                                            🃏 사용 카드: {getCardCount(parseInt(teamsInput))}장
                                        </span>
                                    </div>
                                    <input
                                        type="number"
                                        min="3"
                                        max="8"
                                        value={teamsInput}
                                        onChange={e => setTeamsInput(Math.min(8, Math.max(3, parseInt(e.target.value) || 3)).toString())}
                                        className="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-center text-2xl font-bold focus:outline-none focus:border-amber-400"
                                    />
                                </div>

                                <div className="grid grid-cols-3 gap-2 mt-4">
                                    {Array.from({ length: 6 }, (_, i) => (
                                        <button
                                            key={i + 3}
                                            onClick={() => setTeamsInput((i + 3).toString())}
                                            className={`p-3 rounded-lg font-bold transition ${
                                                parseInt(teamsInput) === i + 3
                                                    ? 'bg-amber-500 text-slate-900'
                                                    : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                            }`}
                                        >
                                            {i + 3}
                                        </button>
                                    ))}
                                </div>

                                <button
                                    onClick={() => initializeTeams(parseInt(teamsInput))}
                                    className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-4 rounded-lg text-lg transition mt-6"
                                >
                                    시작하기 →
                                </button>
                            </div>

                            <p className="text-xs text-slate-500 text-center mt-6">
                                접속 코드: <span className="font-mono font-bold text-slate-400">{peerId}</span>
                            </p>
                        </div>
                    </div>
                );
            }

            // HOST DISPLAY
            if (role === 'host' && teamsCount !== null) {
                return (
                    <div className="p-6 max-w-7xl mx-auto flex flex-col gap-6">
                        {/* Header & Control Panel */}
                        <div className="bg-slate-800 p-4 rounded-xl flex flex-wrap justify-between items-center gap-4 border border-slate-700">
                            <div>
                                <h1 className="text-2xl font-bold text-amber-400">🔥 Hot Streak [Round {round}]</h1>
                                <p className="text-sm text-slate-400">
                                    접속 코드: <span className="text-white font-mono font-bold">{peerId}</span>
                                    <span className="mx-2">•</span>
                                    참여 조: <span className="text-white font-bold">{teamsCount}개</span>
                                    <span className="mx-2">•</span>
                                    사용 카드: <span className="text-amber-300 font-bold">🃏 {getCardCount(teamsCount)}장</span>
                                </p>
                            </div>
                            <div className="flex flex-col gap-3">
                                {/* 카드 준비 */}
                                {gamePhase === 'WAITING' && (
                                    <div className="flex gap-2 flex-wrap">
                                        <button onClick={drawRandomCards} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-bold transition">🎲 랜덤 카드 뽑기</button>
                                        <button onClick={distributeCardsToTeams} className="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg font-bold transition">🎁 3장 카드 나눠주기</button>
                                    </div>
                                )}


                                {/* 경기 시작 및 제어 */}
                                <div className="flex gap-2 flex-wrap">
                                    {gamePhase === 'BETTING' && teamsData.every(t => t.bettingTiles.length === 2) && (
                                        <button onClick={() => {
                                            setGamePhase('RACE');
                                            runRace();
                                        }} className="bg-rose-600 hover:bg-rose-500 px-4 py-2 rounded-lg font-bold transition">
                                            🏎️ 경기 시작!
                                        </button>
                                    )}
                                    <button onClick={nextRound} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg font-bold transition">
                                        다음 라운드 ➡️
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Card Deck */}
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <h2 className="text-xl font-bold mb-4">🃏 이번 라운드 카드 덱 ({deck.length}장)</h2>
                            <div className="flex flex-col gap-3">
                                {deck.length > 0 ? (
                                    <>
                                        {/* 각 마스코트별 카드 */}
                                        {MASCOTS.map(mascot => {
                                            const mascotCards = deck.filter(c => c.mascotId === mascot.id);
                                            return mascotCards.length > 0 ? (
                                                <div key={mascot.id}>
                                                    <div className="text-xs text-slate-400 mb-2">{mascot.name}</div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {mascotCards.map((card, idx) => (
                                                            <div
                                                                key={idx}
                                                                className="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2"
                                                                style={{
                                                                    backgroundColor: mascot.bgColor,
                                                                    borderColor: mascot.strokeColor,
                                                                    color: mascot.strokeColor
                                                                }}
                                                            >
                                                                <span>{card.emoji}</span>
                                                                <span>{card.name}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ) : null;
                                        })}

                                        {/* 모두 적용 카드 */}
                                        {deck.filter(c => c.isUniversal).length > 0 && (
                                            <div>
                                                <div className="text-xs text-slate-400 mb-2">🌍 모두 적용</div>
                                                <div className="flex flex-wrap gap-2">
                                                    {deck.filter(c => c.isUniversal).map((card, idx) => (
                                                        <div
                                                            key={idx}
                                                            className="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2"
                                                            style={{
                                                                backgroundColor: '#15803d',
                                                                borderColor: '#86efac',
                                                                color: '#86efac'
                                                            }}
                                                        >
                                                            <span>{card.emoji}</span>
                                                            <span>{card.name}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <p className="text-slate-400">카드 준비 중...</p>
                                )}
                            </div>
                        </div>

                        {/* Race Track */}
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <h2 className="text-xl font-bold mb-4">🏟️ 경기장 {isDirectControl && selectedMascotId && `(${MASCOTS.find(m => m.id === selectedMascotId)?.name} 선택)`}</h2>
                            <div className="flex flex-col gap-4">
                                {MASCOTS.map(m => (
                                    <div key={m.id} className="flex items-center gap-4">
                                        <span
                                            className={`w-24 font-bold transition ${
                                                isDirectControl
                                                    ? 'cursor-pointer hover:text-amber-300'
                                                    : ''
                                            } ${selectedMascotId === m.id ? 'text-amber-400 ring-2 ring-amber-400 px-2 py-1 rounded' : ''}`}
                                            onClick={() => {
                                                if (isDirectControl) {
                                                    setSelectedMascotId(selectedMascotId === m.id ? null : m.id);
                                                }
                                            }}
                                        >
                                            {m.name}
                                        </span>
                                        <div className="flex-1 bg-slate-700 h-14 rounded-lg relative overflow-hidden px-1">
                                            {/* Track Grid with Numbers and Stars */}
                                            <div className="absolute inset-0 flex items-stretch pointer-events-none">
                                                {Array.from({ length: 14 }).map((_, i) => {
                                                    const position = i - 2;
                                                    const hasStar = position === 5 || position === 10 || position === 11;
                                                    const isStart = position === 0;

                                                    return (
                                                        <div
                                                            key={i}
                                                            className={`flex-1 flex flex-col items-center justify-center text-xs font-bold border-r border-slate-500 cursor-pointer hover:bg-slate-500/50 transition ${
                                                                hasStar ? 'bg-slate-600' : isStart ? 'bg-slate-500' : ''
                                                            } ${
                                                                isDirectControl && selectedMascotId === m.id ? 'pointer-events-auto' : 'pointer-events-none'
                                                            }`}
                                                            onClick={() => {
                                                                if (isDirectControl && selectedMascotId === m.id) {
                                                                    setMascotStates(prev => ({
                                                                        ...prev,
                                                                        [m.id]: {
                                                                            ...prev[m.id],
                                                                            position: Math.min(position, 11)
                                                                        }
                                                                    }));
                                                                }
                                                            }}
                                                        >
                                                            <span className="text-white">{position}</span>
                                                            {hasStar && <span className="text-lg leading-none">⭐</span>}
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            {/* Mascot Marker */}
                                            <div
                                                className="absolute top-1/2 transform -translate-y-1/2 h-8 w-8 rounded-full flex items-center justify-center font-bold text-xs transition-all duration-700 shadow-md text-white z-10"
                                                style={{
                                                    left: `${((mascotStates[m.id].position + 2) / 14) * 100}%`,
                                                    marginLeft: '-16px',
                                                    backgroundColor: m.bgColor,
                                                    border: `${selectedMascotId === m.id && isDirectControl ? '4px' : '2px'} solid ${m.strokeColor}`,
                                                    transform: `translateY(-50%) rotateZ(${mascotStates[m.id].isFallen ? 90 : mascotStates[m.id].direction === -1 ? 180 : 0}deg)`,
                                                    opacity: mascotStates[m.id].isFallen ? 0.6 : 1
                                                }}
                                            >
                                                {Math.round(mascotStates[m.id].position * 2) / 2}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Teams Dashboard */}
                        <div className={`grid gap-4 ${
                            teamsCount <= 2 ? 'grid-cols-1' :
                            teamsCount <= 4 ? 'grid-cols-2' :
                            'grid-cols-4'
                        }`}>
                            {teamsData.map((t, idx) => {
                                const isBettingNow = bettingRound && idx === currentBettingTeamIndex;
                                return (
                                    <div key={t.id} className={`p-4 rounded-xl border transition ${
                                        isBettingNow ? 'bg-amber-900/40 border-amber-500 ring-2 ring-amber-500' :
                                        t.connected ? 'bg-slate-800 border-slate-600' : 'bg-slate-800/40 border-slate-700/50 opacity-50'
                                    }`}>
                                        <div className="flex justify-between items-center mb-2">
                                            <span className="font-bold text-lg">{t.id}조 {isBettingNow && '🎯'}</span>
                                            <span className="text-amber-400 font-bold">{t.score} pt</span>
                                        </div>
                                        <div className="text-xs space-y-1 text-slate-300">
                                            <div>마스코트: {t.bet ? MASCOTS.find(m => m.id === t.bet)?.name : '⏳ 대기'}</div>
                                            <div>배팅 타일: {t.bettingTiles.length}/2 선택 {t.bettingTiles.length === 2 ? '✅' : ''}</div>

                                            {/* 선택한 배팅 타일 표시 */}
                                            {t.bettingTiles.length > 0 && (
                                                <div className="mt-2 pt-2 border-t border-slate-600 space-y-1">
                                                    {t.bettingTiles.map((tile, idx) => {
                                                        const mascot = MASCOTS.find(m => m.id === tile.mascotId);
                                                        return (
                                                            <div key={idx} className="text-xs flex items-center gap-1">
                                                                <span>{mascot?.name}</span>
                                                                <span>타일#{tile.tileId}</span>
                                                                <span className={tile.type === 'safe' ? 'text-blue-300' : 'text-red-300'}>
                                                                    {tile.type === 'safe' ? '🛡️' : '⚡'}
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            <div>접속: {t.connected ? '✅' : '⏳'}</div>
                                        </div>

                                        {/* 배팅 제어 버튼 */}
                                        {(gamePhase === 'WAITING' || gamePhase === 'BETTING') && (
                                            <div className="mt-4 pt-3 border-t border-slate-600 space-y-2">
                                                {(gamePhase === 'WAITING' || bettingRound === 'FIRST') && t.bettingTiles.length === 0 && (
                                                    <button
                                                        onClick={() => {
                                                            if (gamePhase === 'WAITING') {
                                                                setGamePhase('BETTING');
                                                                broadcastPhase('BETTING');
                                                            }
                                                            if (!bettingRound) {
                                                                setBettingRound('FIRST');
                                                            }
                                                            setCurrentBettingTeamIndex(idx);
                                                            Object.values(teamConnectionsRef.current).forEach(conn => {
                                                                if (conn && conn.open) {
                                                                    conn.send({
                                                                        type: 'BETTING_UPDATE',
                                                                        currentBettingTeamIndex: idx,
                                                                        bettingRound: bettingRound || 'FIRST',
                                                                        teamsData: teamsData.map(t => ({ id: t.id, bettingTiles: t.bettingTiles }))
                                                                    });
                                                                }
                                                            });
                                                        }}
                                                        className="w-full bg-amber-600 hover:bg-amber-500 px-2 py-1 rounded text-xs font-bold transition"
                                                    >
                                                        배팅 시작
                                                    </button>
                                                )}
                                                {bettingRound === 'SECOND' && t.bettingTiles.length === 1 && (
                                                    <button
                                                        onClick={() => {
                                                            setCurrentBettingTeamIndex(idx);
                                                            Object.values(teamConnectionsRef.current).forEach(conn => {
                                                                if (conn && conn.open) {
                                                                    conn.send({
                                                                        type: 'BETTING_UPDATE',
                                                                        currentBettingTeamIndex: idx,
                                                                        bettingRound: 'SECOND',
                                                                        teamsData: teamsData.map(t => ({ id: t.id, bettingTiles: t.bettingTiles }))
                                                                    });
                                                                }
                                                            });
                                                        }}
                                                        className="w-full bg-orange-600 hover:bg-orange-500 px-2 py-1 rounded text-xs font-bold transition"
                                                    >
                                                        배팅 시작
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {/* 점수 입력 */}
                                        <div className="mt-4 pt-3 border-t border-slate-600">
                                            <div className="text-xs text-slate-400 mb-2">점수 추가</div>
                                            <div className="flex gap-2">
                                                <input
                                                    type="number"
                                                    min="0"
                                                    value={scoreInputs[t.id] || ''}
                                                    onChange={(e) => setScoreInputs(prev => ({ ...prev, [t.id]: e.target.value }))}
                                                    placeholder="점수 입력"
                                                    className="flex-1 px-2 py-1 rounded text-xs bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-slate-500"
                                                />
                                                <button
                                                    onClick={() => {
                                                        const score = parseInt(scoreInputs[t.id]) || 0;
                                                        if (score <= 0) {
                                                            alert('0보다 큰 숫자를 입력해주세요.');
                                                            return;
                                                        }
                                                        const newTeamsData = teamsData.map(team =>
                                                            team.id === t.id ? { ...team, score: team.score + score } : team
                                                        );
                                                        setTeamsData(newTeamsData);
                                                        setScoreInputs(prev => ({ ...prev, [t.id]: '' }));

                                                        // 클라이언트에 점수 업데이트 브로드캐스트
                                                        Object.values(teamConnectionsRef.current).forEach(conn => {
                                                            if (conn && conn.open) {
                                                                conn.send({
                                                                    type: 'SCORE_UPDATE',
                                                                    teamNo: t.id,
                                                                    newScore: newTeamsData.find(x => x.id === t.id).score
                                                                });
                                                            }
                                                        });
                                                    }}
                                                    className="bg-green-600 hover:bg-green-500 px-3 py-1 rounded text-xs font-bold transition"
                                                >
                                                    +점수
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }

            // CLIENT DISPLAY
            if (role === 'client') {
                const myTeam = teamsData.find(t => t.id === Number(teamNo));

                const selectBettingMascot = (mascotId) => {
                    setSelectedBettingMascot(mascotId);
                };

                const selectBettingTile = (mascotId, tileType) => {
                    const tiles = BETTING_TILES[mascotId];

                    // 다른 팀이 선택한 타일 ID 수집
                    const selectedTileIds = new Set();
                    allTeamsBettingTiles.forEach(team => {
                        team.bettingTiles.forEach(tile => {
                            if (tile.mascotId === mascotId) {
                                selectedTileIds.add(tile.tileId);
                            }
                        });
                    });

                    // 다음에 선택할 수 있는 타일 찾기
                    let nextTile = null;
                    for (let i = 0; i < tiles.length; i++) {
                        if (!selectedTileIds.has(tiles[i].id)) {
                            nextTile = tiles[i];
                            break;
                        }
                    }

                    if (!nextTile) {
                        alert('더 이상 가져갈 수 있는 타일이 없습니다.');
                        return;
                    }

                    const tile = nextTile;
                    const points = tile[tileType];

                    // Host에 전송
                    if (connRef.current) {
                        connRef.current.send({
                            type: 'SUBMIT_BETTING_TILE',
                            teamNo: Number(teamNo),
                            bettingTile: { mascotId, tileId: tile.id, type: tileType, points }
                        });
                    }

                    setSelectedBettingMascot(null);
                };

                const sendBet = (mascotId) => {
                    if (connRef.current) connRef.current.send({ type: 'SUBMIT_BET', teamNo: Number(teamNo), bet: mascotId });
                    setTeamsData(prev => prev.map(t => t.id === Number(teamNo) ? { ...t, bet: mascotId } : t));
                };

                const sendCard = (mascotId, cardId) => {
                    if (connRef.current) connRef.current.send({ type: 'SUBMIT_CARD', teamNo: Number(teamNo), card: { mascotId, cardId } });
                    setTeamsData(prev => prev.map(t => t.id === Number(teamNo) ? { ...t, card: { mascotId, cardId } } : t));
                };

                return (
                    <div className="p-4 max-w-md mx-auto min-h-[550px] flex flex-col justify-between">
                        <div>
                            <div className="bg-slate-800 p-4 rounded-xl flex justify-between items-center mb-6 border border-slate-700">
                                <span className="text-xl font-bold text-amber-400">{teamNo}조 화면</span>
                                <span className="text-sm bg-slate-700 px-3 py-1 rounded-full font-bold">Phase: {gamePhase}</span>
                            </div>

                            {/* WAITING PHASE */}
                            {gamePhase === 'WAITING' && (
                                <div className="flex flex-col gap-6">
                                    <div className="text-center py-8">
                                        <div className="text-6xl mb-4">⏳</div>
                                        <h2 className="text-2xl font-bold mb-2 text-amber-300">배팅 준비 중</h2>
                                        <p className="text-slate-400 text-sm">호스트가 준비하고 있습니다...</p>
                                    </div>

                                    {/* 받은 카드 */}
                                    {receivedCards.length > 0 && (
                                        <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                            <h3 className="text-sm font-bold text-amber-300 mb-3">🎁 나눠받은 카드 ({receivedCards.length}장)</h3>
                                            <div className="grid grid-cols-1 gap-2">
                                                {receivedCards.map((card, idx) => {
                                                    const mascot = MASCOTS.find(m => m.id === card.mascotId);
                                                    const color = card.isUniversal ? '#15803d' : mascot?.strokeColor || '#999';
                                                    const bgColor = card.isUniversal ? '#86efac' : mascot?.bgColor || '#f3f4f6';
                                                    return (
                                                        <div
                                                            key={idx}
                                                            className="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2"
                                                            style={{
                                                                backgroundColor: bgColor,
                                                                borderColor: color,
                                                                color: color
                                                            }}
                                                        >
                                                            <span>{card.emoji}</span>
                                                            <span>{card.name}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    <div className="text-center text-xs text-slate-500 space-y-1">
                                        <p>✅ 랜덤 카드 뽑기</p>
                                        <p>✅ 3장 카드 나눠주기</p>
                                        <p>⏳ 배팅 시작 버튼 대기 중...</p>
                                    </div>
                                </div>
                            )}

                            {/* BETTING PHASE */}
                            {gamePhase === 'BETTING' && (
                                <div className="flex flex-col gap-6">
                                    {/* 현재 배팅 팀 표시 */}
                                    <div className="text-center bg-slate-700/50 p-3 rounded-lg">
                                        <p className="text-xs text-slate-400">현재 배팅 진행</p>
                                        <p className="text-lg font-bold text-amber-300">
                                            {hostCurrentBettingTeamIndex + 1}조
                                            {hostCurrentBettingTeamIndex + 1 === Number(teamNo) ? ' 🎯 (당신)' : ''}
                                        </p>
                                        {hostCurrentBettingTeamIndex + 1 !== Number(teamNo) && (
                                            <p className="text-xs text-slate-400 mt-2">다른 팀이 배팅 중입니다...</p>
                                        )}
                                    </div>

                                    {/* 자신의 배팅 타일 */}
                                    {allTeamsBettingTiles.find(t => t.id === Number(teamNo))?.bettingTiles.length > 0 && (
                                        <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                            <h3 className="text-sm font-bold text-amber-300 mb-3">🎰 선택한 배팅 타일 ({allTeamsBettingTiles.find(t => t.id === Number(teamNo))?.bettingTiles.length}/2)</h3>
                                            <div className="grid grid-cols-1 gap-2">
                                                {allTeamsBettingTiles.find(t => t.id === Number(teamNo))?.bettingTiles.map((tile, idx) => {
                                                    const mascot = MASCOTS.find(m => m.id === tile.mascotId);
                                                    return (
                                                        <div
                                                            key={idx}
                                                            className="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2"
                                                            style={{
                                                                backgroundColor: mascot?.bgColor,
                                                                borderColor: mascot?.strokeColor,
                                                                color: mascot?.strokeColor
                                                            }}
                                                        >
                                                            <span>{mascot?.name}</span>
                                                            <span>타일#{tile.tileId}</span>
                                                            <span className={tile.type === 'safe' ? 'text-blue-300' : 'text-red-300'}>
                                                                {tile.type === 'safe' ? '🛡️' : '⚡'}
                                                            </span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* 마스코트 선택 */}
                                    {hostCurrentBettingTeamIndex + 1 === Number(teamNo) ? (
                                        <div>
                                            <h2 className="text-lg font-bold mb-4">🎯 마스코트 선택</h2>
                                            <div className="grid grid-cols-2 gap-2">
                                                {MASCOTS.map(m => (
                                                    <button
                                                        key={m.id}
                                                        onClick={() => selectBettingMascot(m.id)}
                                                        className="p-3 rounded-xl font-bold text-sm border transition"
                                                        style={{
                                                            backgroundColor: selectedBettingMascot === m.id ? m.bgColor : '#1e293b',
                                                            borderColor: selectedBettingMascot === m.id ? m.strokeColor : '#334155',
                                                            color: selectedBettingMascot === m.id ? m.strokeColor : '#cbd5e1'
                                                        }}
                                                    >
                                                        {m.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-6 bg-slate-700/30 rounded-lg">
                                            <p className="text-slate-400">다른 팀이 배팅하고 있습니다</p>
                                            <p className="text-sm text-slate-500 mt-2">차례를 기다려주세요...</p>
                                        </div>
                                    )}

                                    {/* 배팅 타일 선택 */}
                                    {selectedBettingMascot && (
                                        <div>
                                            <h3 className="text-sm font-bold mb-3 text-amber-300">📊 배팅 타일 선택</h3>
                                            <div className="bg-slate-700/50 p-3 rounded-lg space-y-2">
                                                {(() => {
                                                    // 다른 팀이 선택한 타일 ID 수집
                                                    const selectedTileIds = new Set();
                                                    allTeamsBettingTiles.forEach(team => {
                                                        team.bettingTiles.forEach(tile => {
                                                            if (tile.mascotId === selectedBettingMascot) {
                                                                selectedTileIds.add(tile.tileId);
                                                            }
                                                        });
                                                    });

                                                    // 다음에 선택할 수 있는 타일 찾기
                                                    const tiles = BETTING_TILES[selectedBettingMascot];
                                                    let nextTile = null;
                                                    for (let i = 0; i < tiles.length; i++) {
                                                        if (!selectedTileIds.has(tiles[i].id)) {
                                                            nextTile = tiles[i];
                                                            break;
                                                        }
                                                    }

                                                    return nextTile ? (
                                                        <>
                                                            <div className="text-xs text-slate-400 mb-2">타일 #{nextTile.id}</div>
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <button
                                                                    onClick={() => selectBettingTile(selectedBettingMascot, 'safe')}
                                                                    className="p-2 rounded-lg text-sm font-bold bg-blue-600 hover:bg-blue-500 transition"
                                                                >
                                                                    🛡️ 안전<br/>
                                                                    <span className="text-xs">
                                                                        1등 {nextTile.safe[1]}pt,
                                                                        2등 {nextTile.safe[2]}pt,
                                                                        3등 {nextTile.safe[3]}pt
                                                                    </span>
                                                                </button>
                                                                <button
                                                                    onClick={() => selectBettingTile(selectedBettingMascot, 'risky')}
                                                                    className="p-2 rounded-lg text-sm font-bold bg-red-600 hover:bg-red-500 transition"
                                                                >
                                                                    ⚡ 위험<br/>
                                                                    <span className="text-xs">
                                                                        1등 {nextTile.risky[1]}pt,
                                                                        2등 {nextTile.risky[2]}pt,
                                                                        3등 {nextTile.risky[3]}pt
                                                                    </span>
                                                                </button>
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <p className="text-sm text-slate-400">모든 타일이 가져가졌습니다.</p>
                                                    );
                                                })()}
                                            </div>
                                        </div>
                                    )}

                                    {/* 받은 카드 */}
                                    {receivedCards.length > 0 && (
                                        <div className="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                                            <h3 className="text-sm font-bold text-amber-300 mb-3">🎁 나눠받은 카드 ({receivedCards.length}장)</h3>
                                            <div className="grid grid-cols-1 gap-2">
                                                {receivedCards.map((card, idx) => {
                                                    const mascot = MASCOTS.find(m => m.id === card.mascotId);
                                                    const color = card.isUniversal ? '#15803d' : mascot?.strokeColor || '#999';
                                                    const bgColor = card.isUniversal ? '#86efac' : mascot?.bgColor || '#f3f4f6';
                                                    return (
                                                        <div
                                                            key={idx}
                                                            className="px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2"
                                                            style={{
                                                                backgroundColor: bgColor,
                                                                borderColor: color,
                                                                color: color
                                                            }}
                                                        >
                                                            <span>{card.emoji}</span>
                                                            <span>{card.name}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* WAIT / RESULT PHASE */}
                            {(gamePhase === 'RACE' || gamePhase === 'RESULT') && (
                                <div className="text-center py-12">
                                    <div className="text-4xl mb-4">🏎️</div>
                                    <h2 className="text-xl font-bold mb-2">레이스가 진행 중입니다!</h2>
                                    <p className="text-slate-400 text-sm">메인 화면을 확인해 주세요.</p>
                                </div>
                            )}
                        </div>

                        <div className="text-center text-xs text-slate-500 py-4">Hot Streak Workshop Assistant</div>
                    </div>
                );
            }

            // Fallback - 디버그용
            return (
                <div className="p-8 text-center">
                    <p className="text-red-400 font-bold mb-4">🔴 오류: 상태를 읽을 수 없습니다</p>
                    <p className="text-slate-400 mb-4">role: {role} | gamePhase: {gamePhase}</p>
                    <p className="text-slate-500 text-sm">F12 콘솔에서 에러를 확인해주세요</p>
                </div>
            );
        }

        // Client Sub-component for Card Selection
        function CardSelection({ MASCOTS, CARDS, onSubmit, currentCard }) {
            const [selectedMascot, setSelectedMascot] = useState(MASCOTS[0].id);
            const [selectedCard, setSelectedCard] = useState(CARDS[0].id);

            return (
                <div className="bg-slate-800 p-4 rounded-xl flex flex-col gap-4 border border-slate-700">
                    <div>
                        <label className="text-xs text-slate-400 block mb-2">대상 마스코트</label>
                        <div className="grid grid-cols-2 gap-2">
                            {MASCOTS.map(m => (
                                <button
                                    key={m.id}
                                    onClick={() => setSelectedMascot(m.id)}
                                    className="p-2 rounded text-sm font-bold border transition"
                                    style={{
                                        backgroundColor: selectedMascot === m.id ? m.bgColor : '#475569',
                                        borderColor: selectedMascot === m.id ? m.strokeColor : '#334155',
                                        color: selectedMascot === m.id ? m.strokeColor : '#cbd5e1'
                                    }}
                                >
                                    {m.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <label className="text-xs text-slate-400 block mb-2">적용할 카드</label>
                        <div className="grid grid-cols-2 gap-2">
                            {CARDS.map(c => (
                                <button
                                    key={c.id}
                                    onClick={() => setSelectedCard(c.id)}
                                    className={`p-2 rounded text-sm font-bold border transition ${selectedCard === c.id ? 'bg-emerald-600 border-emerald-400' : 'bg-slate-700 border-slate-600'}`}
                                >
                                    {c.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <button
                        onClick={() => onSubmit(selectedMascot, selectedCard)}
                        className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold py-3 rounded-lg transition mt-2"
                    >
                        {currentCard ? '카드 변경 및 제출' : '카드 제출하기'}
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('react-hotstreak-root'));
        root.render(<HotStreakApp />);
    </script>
</body>

</html>
