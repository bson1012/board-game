<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Streak Workshop Boardgame (YES/NO Edition)</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const MASCOTS = [
      { id: 'hotdog', name: '🌭 핫도그', color: 'bg-red-500' },
      { id: 'bear', name: '🐻 곰돌이', color: 'bg-amber-600' },
      { id: 'duck', name: '🦆 오리', color: 'bg-yellow-400' },
      { id: 'rabbit', name: '🐰 토끼', color: 'bg-pink-400' }
    ];

    const CARDS = [
      { id: 'f2', label: '🚀 +2칸 전진' },
      { id: 'f1', label: '🏃 +1칸 전진' },
      { id: 'b1', label: '🍌 -1칸 후퇴' },
      { id: 'stop', label: '🛑 얼음 (정지)' },
      { id: 'swap_front', label: '🔄 앞 말과 교체 (스왑)' },
      { id: 'boost_last', label: '🔥 꼴찌 쾌속 (+3칸)' }
    ];

    function App() {
      const [role, setRole] = useState(null); // 'host' | 'client'
      const [peerId, setPeerId] = useState('');
      const [targetHostId, setTargetHostId] = useState('');
      const [teamNo, setTeamNo] = useState(1);

      // State for Host
      const [teamsData, setTeamsData] = useState(
        Array.from({ length: 8 }, (_, i) => ({
          id: i + 1,
          connected: false,
          bet: null, // { mascotId, type: 'WINNER' | 'YES_TOP2' | 'NO_TOP2' }
          card: null,
          score: 100
        }))
      );
      const [gamePhase, setGamePhase] = useState('BETTING'); // BETTING, CARD, RACE, RESULT
      const [mascotPositions, setMascotPositions] = useState({ hotdog: 0, bear: 0, duck: 0, rabbit: 0 });
      const [round, setRound] = useState(1);

      // PeerJS refs
      const peerRef = useRef(null);
      const connRef = useRef(null);
      const connectionsRef = useRef({});

      // Host Peer Init
      const initHost = () => {
        const id = 'hotstreak-workshop-' + Math.floor(1000 + Math.random() * 9000);
        const peer = new Peer(id);
        peerRef.current = peer;

        peer.on('open', (id) => {
          setPeerId(id);
          setRole('host');
        });

        peer.on('connection', (conn) => {
          connectionsRef.current[conn.peer] = conn;
          conn.on('data', (data) => handleClientData(data, conn.peer));
        });
      };

      // Client Peer Init
      const initClient = () => {
        if (!targetHostId) return alert('호스트 코드를 입력하세요!');
        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', () => {
          const conn = peer.connect(targetHostId);
          connRef.current = conn;
          
          conn.on('open', () => {
            setRole('client');
            conn.send({ type: 'JOIN', teamNo: Number(teamNo) });
          });

          conn.on('data', (data) => {
            if (data.type === 'PHASE_CHANGE') setGamePhase(data.phase);
          });
        });
      };

      // Host Data Handler
      const handleClientData = (data, peerId) => {
        if (data.type === 'JOIN') {
          setTeamsData(prev => prev.map(t => t.id === data.teamNo ? { ...t, connected: true } : t));
        } else if (data.type === 'SUBMIT_BET') {
          setTeamsData(prev => prev.map(t => t.id === data.teamNo ? { ...t, bet: data.bet } : t));
        } else if (data.type === 'SUBMIT_CARD') {
          setTeamsData(prev => prev.map(t => t.id === data.teamNo ? { ...t, card: data.card } : t));
        }
      };

      const broadcastPhase = (phase) => {
        setGamePhase(phase);
        Object.values(connectionsRef.current).forEach(conn => {
          if (conn.open) conn.send({ type: 'PHASE_CHANGE', phase });
        });
      };

      // 레이스 계산 및 YES/NO 정산 로직
      const runRace = () => {
        broadcastPhase('RACE');
        let newPos = { ...mascotPositions };

        // 무브먼트/특수 카드 처리
        teamsData.forEach(t => {
          if (t.card) {
            const mId = t.card.mascotId;
            const cType = t.card.cardId;
            const currentPos = newPos[mId];

            if (cType === 'f2') {
              newPos[mId] = Math.min(10, currentPos + 2);
            } else if (cType === 'f1') {
              newPos[mId] = Math.min(10, currentPos + 1);
            } else if (cType === 'b1') {
              newPos[mId] = Math.max(0, currentPos - 1);
            } else if (cType === 'swap_front') {
              let targetId = null;
              let targetPos = 11; 
              for (let [id, pos] of Object.entries(newPos)) {
                if (pos > currentPos && pos < targetPos) {
                  targetId = id;
                  targetPos = pos;
                }
              }
              if (targetId) {
                newPos[mId] = targetPos;
                newPos[targetId] = currentPos;
              }
            } else if (cType === 'boost_last') {
              const minPos = Math.min(...Object.values(newPos));
              if (currentPos === minPos) {
                newPos[mId] = Math.min(10, currentPos + 3);
              }
            }
          }
        });

        // 결과 계산 및 YES/NO 정산
        setTimeout(() => {
          setMascotPositions(newPos);
          
          const sorted = Object.entries(newPos).sort((a, b) => b[1] - a[1]);
          const winnerId = sorted[0][0];
          const top2Ids = [sorted[0][0], sorted[1][0]];

          setTeamsData(prev => prev.map(t => {
            if (!t.bet) return t;

            let addScore = 0;
            const { mascotId, type } = t.bet;

            // 🏆 1등 베팅 정산 (+50pt)
            if (type === 'WINNER' && mascotId === winnerId) {
              addScore = 50;
            } 
            // 👍 Top2 YES 베팅 정산 (+25pt)
            else if (type === 'YES_TOP2' && top2Ids.includes(mascotId)) {
              addScore = 25;
            } 
            // 👎 Top2 NO 베팅 정산 (+25pt)
            else if (type === 'NO_TOP2' && !top2Ids.includes(mascotId)) {
              addScore = 25;
            }

            return { ...t, score: t.score + addScore };
          }));

          setTimeout(() => broadcastPhase('RESULT'), 2000);
        }, 1000);
      };

      const nextRound = () => {
        setMascotPositions({ hotdog: 0, bear: 0, duck: 0, rabbit: 0 });
        setTeamsData(prev => prev.map(t => ({ ...t, bet: null, card: null })));
        setRound(r => r + 1);
        broadcastPhase('BETTING');
      };

      // Selection Screen
      if (!role) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 className="text-4xl font-extrabold mb-8 text-amber-400">🔥 Hot Streak Workshop</h1>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-md">
              <button onClick={initHost} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-6 rounded-xl shadow-lg transition">
                📺 메인 스크린 생성 (Host)
              </button>
              <div className="bg-slate-800 p-6 rounded-xl flex flex-col gap-3">
                <h2 className="text-xl font-bold">📱 조별 접속 (Client)</h2>
                <input 
                  type="text" 
                  placeholder="호스트 코드 입력 (예: hotstreak-workshop-1234)" 
                  value={targetHostId}
                  onChange={e => setTargetHostId(e.target.value)}
                  className="p-2 rounded bg-slate-700 border border-slate-600 text-white"
                />
                <select 
                  value={teamNo} 
                  onChange={e => setTeamNo(e.target.value)}
                  className="p-2 rounded bg-slate-700 border border-slate-600 text-white"
                >
                  {Array.from({ length: 8 }, (_, i) => (
                    <option key={i + 1} value={i + 1}>{i + 1}조</option>
                  ))}
                </select>
                <button onClick={initClient} className="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg transition">
                  접속하기
                </button>
              </div>
            </div>
          </div>
        );
      }

      // HOST DISPLAY
      if (role === 'host') {
        const renderBetLabel = (bet) => {
          if (!bet) return '⏳ 대기 중';
          const mascotName = MASCOTS.find(m => m.id === bet.mascotId)?.name;
          if (bet.type === 'WINNER') return `🏆 1등: ${mascotName}`;
          if (bet.type === 'YES_TOP2') return `👍 Top2 YES: ${mascotName}`;
          if (bet.type === 'NO_TOP2') return `👎 Top2 NO: ${mascotName}`;
          return '완료';
        };

        return (
          <div className="p-6 max-w-7xl mx-auto flex flex-col gap-6">
            <div className="bg-slate-800 p-4 rounded-xl flex flex-wrap justify-between items-center gap-4">
              <div>
                <h1 className="text-2xl font-bold text-amber-400">🔥 Hot Streak [Round {round}]</h1>
                <p className="text-sm text-slate-400">접속 코드: <span className="text-white font-mono font-bold text-lg bg-slate-700 px-2 py-1 rounded">{peerId}</span></p>
              </div>
              <div className="flex gap-2">
                {gamePhase === 'BETTING' && <button onClick={() => broadcastPhase('CARD')} className="bg-blue-600 px-4 py-2 rounded-lg font-bold">카드 제출 단계로</button>}
                {gamePhase === 'CARD' && <button onClick={runRace} className="bg-rose-600 px-4 py-2 rounded-lg font-bold">🏎️ 레이스 시작!</button>}
                {gamePhase === 'RESULT' && <button onClick={nextRound} className="bg-emerald-600 px-4 py-2 rounded-lg font-bold">다음 라운드 ➡️</button>}
              </div>
            </div>

            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
              <h2 className="text-xl font-bold mb-4">🏟️ 경기장</h2>
              <div className="flex flex-col gap-4">
                {MASCOTS.map(m => (
                  <div key={m.id} className="flex items-center gap-4">
                    <span className="w-24 font-bold">{m.name}</span>
                    <div className="flex-1 bg-slate-700 h-10 rounded-lg relative overflow-hidden flex items-center px-2">
                      <div className="absolute inset-0 grid grid-cols-11 pointer-events-none opacity-20">
                        {Array.from({ length: 11 }).map((_, i) => (
                          <div key={i} className="border-r border-white"></div>
                        ))}
                      </div>
                      <div 
                        className={`h-8 w-8 rounded-full ${m.color} flex items-center justify-center font-bold text-xs transition-all duration-[1500ms] shadow-md z-10`}
                        style={{ left: `${(mascotPositions[m.id] / 10) * 90}%`, position: 'relative' }}
                      >
                        {mascotPositions[m.id]}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {teamsData.map(t => (
                <div key={t.id} className={`p-4 rounded-xl border ${t.connected ? 'bg-slate-800 border-slate-600' : 'bg-slate-800/40 border-slate-700/50 opacity-50'}`}>
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-bold text-lg">{t.id}조</span>
                    <span className="text-amber-400 font-bold">{t.score} pt</span>
                  </div>
                  <div className="text-xs space-y-1 text-slate-300">
                    <div>베팅: {renderBetLabel(t.bet)}</div>
                    <div>카드: {t.card ? '✅ 제출 완료' : '⏳ 대기 중'}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // CLIENT DISPLAY
      if (role === 'client') {
        const myTeam = teamsData.find(t => t.id === Number(teamNo));

        const sendBet = (betObj) => {
          if (connRef.current) connRef.current.send({ type: 'SUBMIT_BET', teamNo: Number(teamNo), bet: betObj });
          setTeamsData(prev => prev.map(t => t.id === Number(teamNo) ? { ...t, bet: betObj } : t));
        };

        const sendCard = (mascotId, cardId) => {
          if (connRef.current) connRef.current.send({ type: 'SUBMIT_CARD', teamNo: Number(teamNo), card: { mascotId, cardId } });
          setTeamsData(prev => prev.map(t => t.id === Number(teamNo) ? { ...t, card: { mascotId, cardId } } : t));
        };

        return (
          <div className="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">
            <div>
              <div className="bg-slate-800 p-4 rounded-xl flex justify-between items-center mb-6 border border-slate-600">
                <span className="text-xl font-bold text-amber-400">{teamNo}조 화면</span>
                <span className="text-sm bg-slate-700 px-3 py-1 rounded-full font-bold">Phase: {gamePhase}</span>
              </div>

              {gamePhase === 'BETTING' && (
                <BetSelection MASCOTS={MASCOTS} onSubmit={sendBet} currentBet={myTeam?.bet} />
              )}

              {gamePhase === 'CARD' && (
                <CardSelection MASCOTS={MASCOTS} CARDS={CARDS} onSubmit={sendCard} currentCard={myTeam?.card} />
              )}

              {(gamePhase === 'RACE' || gamePhase === 'RESULT') && (
                <div className="text-center py-12">
                  <div className="text-5xl mb-4 animate-bounce">🏎️</div>
                  <h2 className="text-xl font-bold mb-2">레이스가 진행 중입니다!</h2>
                  <p className="text-slate-400 text-sm">대형 스크린을 확인해 주세요.</p>
                </div>
              )}
            </div>
            <div className="text-center text-xs text-slate-500 py-4">Hot Streak Workshop Assistant</div>
          </div>
        );
      }
    }

    // Client Sub-component for Bet Selection (YES/NO included)
    function BetSelection({ MASCOTS, onSubmit, currentBet }) {
      const [selectedMascot, setSelectedMascot] = useState(currentBet?.mascotId || MASCOTS[0].id);
      const [betType, setBetType] = useState(currentBet?.type || 'WINNER');

      return (
        <div className="bg-slate-800 p-4 rounded-xl flex flex-col gap-5 border border-slate-700">
          <div>
            <label className="text-sm font-bold text-slate-300 block mb-3">1. 베팅할 마스코트 선택</label>
            <div className="grid grid-cols-2 gap-2">
              {MASCOTS.map(m => (
                <button 
                  key={m.id}
                  onClick={() => setSelectedMascot(m.id)}
                  className={`p-3 rounded-lg text-sm font-bold border transition ${selectedMascot === m.id ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
                >
                  {m.name}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="text-sm font-bold text-slate-300 block mb-3">2. 베팅 방식 선택</label>
            <div className="flex flex-col gap-2">
              <button 
                onClick={() => setBetType('WINNER')}
                className={`p-3 rounded-lg text-sm font-bold text-left border transition flex justify-between items-center ${betType === 'WINNER' ? 'bg-amber-600 border-amber-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
              >
                <span>🏆 단독 1등 예상</span>
                <span className="text-xs bg-black/30 px-2 py-1 rounded">+50pt</span>
              </button>

              <button 
                onClick={() => setBetType('YES_TOP2')}
                className={`p-3 rounded-lg text-sm font-bold text-left border transition flex justify-between items-center ${betType === 'YES_TOP2' ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
              >
                <span>👍 Top 2 안에 들어간다 (YES)</span>
                <span className="text-xs bg-black/30 px-2 py-1 rounded">+25pt</span>
              </button>

              <button 
                onClick={() => setBetType('NO_TOP2')}
                className={`p-3 rounded-lg text-sm font-bold text-left border transition flex justify-between items-center ${betType === 'NO_TOP2' ? 'bg-rose-600 border-rose-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
              >
                <span>👎 Top 2 안에 못 들어간다 (NO)</span>
                <span className="text-xs bg-black/30 px-2 py-1 rounded">+25pt</span>
              </button>
            </div>
          </div>

          <button 
            onClick={() => onSubmit({ mascotId: selectedMascot, type: betType })}
            className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold py-4 rounded-xl transition mt-2 shadow-lg"
          >
            {currentBet ? '베팅 변경하기' : '베팅 최종 제출'}
          </button>
        </div>
      );
    }

    function CardSelection({ MASCOTS, CARDS, onSubmit, currentCard }) {
      const [selectedMascot, setSelectedMascot] = useState(currentCard?.mascotId || MASCOTS[0].id);
      const [selectedCard, setSelectedCard] = useState(currentCard?.cardId || CARDS[0].id);

      return (
        <div className="bg-slate-800 p-4 rounded-xl flex flex-col gap-5 border border-slate-700">
          <div>
            <label className="text-sm font-bold text-slate-300 block mb-3">1. 어떤 마스코트에게 쓸까요?</label>
            <div className="grid grid-cols-2 gap-2">
              {MASCOTS.map(m => (
                <button 
                  key={m.id}
                  onClick={() => setSelectedMascot(m.id)}
                  className={`p-3 rounded-lg text-sm font-bold border transition ${selectedMascot === m.id ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
                >
                  {m.name}
                </button>
              ))}
            </div>
          </div>

          <div>
            <label className="text-sm font-bold text-slate-300 block mb-3">2. 적용할 카드를 고르세요</label>
            <div className="grid grid-cols-2 gap-2">
              {CARDS.map(c => (
                <button 
                  key={c.id}
                  onClick={() => setSelectedCard(c.id)}
                  className={`p-3 rounded-lg text-sm font-bold border transition ${selectedCard === c.id ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300'}`}
                >
                  {c.label}
                </button>
              ))}
            </div>
          </div>

          <button 
            onClick={() => onSubmit(selectedMascot, selectedCard)}
            className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-extrabold py-4 rounded-xl transition mt-2 shadow-lg"
          >
            {currentCard ? '카드 변경 (다시 제출)' : '최종 제출하기'}
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
